name: Linux desktop gate

on:
  push:
    branches: [linux-desktop]
  pull_request:
    branches: [linux-desktop]

permissions:
  contents: read

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:base-devel

    steps:
      - uses: actions/checkout@v4

      - name: Install build and QEMU dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            bc busybox cpio dosfstools e2fsprogs efibootmgr elfutils git grub libinput \
            iw linux-firmware-intel linux-firmware-realtek mtools openssl pahole \
            parted perl python util-linux wpa_supplicant

      - name: Run fast security and update tests
        run: |
          make linux-security-test
          make linux-update-test
          make linux-download-test
          make linux-shared-api-test
          make linux-input-test
          make linux-package-test
          make linux-settings-test
          make linux-release-test

      - name: Configure and build Linux
        env:
          FIFI_BUILD_ID: ${{ github.sha }}
        run: |
          make linux-setup
          make linux-kernel
          make linux-initrd

      - name: Export the clean Linux boot pair
        uses: actions/upload-artifact@v4
        with:
          name: fifi-linux-ci-boot-pair
          path: |
            build-linux/bzImage
            build-linux/initramfs.cpio.gz
          compression-level: 0
          if-no-files-found: error

  boot-and-fallback:
    needs: build-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install host QEMU and UEFI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            busybox-static cpio dosfstools e2fsprogs grub-common \
            grub-efi-amd64-bin mtools ovmf parted qemu-system-x86

      - name: Restore the clean Linux boot pair
        uses: actions/download-artifact@v4
        with:
          name: fifi-linux-ci-boot-pair
          path: build-linux

      - name: Run boot and screenshot gate
        run: make linux-qemu-test

      - name: Run automatic boot fallback gate
        env:
          FIFI_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          FIFI_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
        run: make linux-boot-fallback-test
