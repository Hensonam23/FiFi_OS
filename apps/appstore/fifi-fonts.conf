<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- FiFi OS runtime fontconfig. Font dirs + writable cache, generic-family
     mapping, and named-family aliases. The named aliases matter: app chrome
     (Firefox/LibreWolf tab titles + URL bar, GTK/Qt widgets) requests a UI font
     by NAME (Sans, Cantarell, Arial, ...) not by generic family; without the
     standard conf.d present those names resolve to nothing, so chrome text
     renders blank while web content (which uses sans-serif) works.
     Deployed to /fifi-data/runtime/etc/fonts/fonts.conf. -->
<fontconfig>
  <dir>/fifi-data/browser/sysroot/usr/share/fonts</dir>
  <dir>/fifi-data/runtime/share/fonts</dir>
  <dir>/fifi-data/fonts</dir>
  <cachedir>/fifi-data/runtime/cache/fontconfig</cachedir>
  <include ignore_missing="yes">conf.d</include>

  <!-- Generic families -> concrete bundled fonts -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans Mono</string></edit>
  </match>

  <!-- Named UI/web font families default to the matching generic so any
       request resolves. binding="same" keeps size/weight from the request. -->
  <alias binding="same"><family>Sans</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>System-ui</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>system-ui</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>ui-sans-serif</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Cantarell</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Ubuntu</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Roboto</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Noto Sans</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Open Sans</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Segoe UI</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Arial</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Helvetica</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Verdana</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Tahoma</family><default><family>sans-serif</family></default></alias>
  <alias binding="same"><family>Liberation Sans</family><default><family>sans-serif</family></default></alias>

  <alias binding="same"><family>Serif</family><default><family>serif</family></default></alias>
  <alias binding="same"><family>ui-serif</family><default><family>serif</family></default></alias>
  <alias binding="same"><family>Times</family><default><family>serif</family></default></alias>
  <alias binding="same"><family>Times New Roman</family><default><family>serif</family></default></alias>
  <alias binding="same"><family>Georgia</family><default><family>serif</family></default></alias>
  <alias binding="same"><family>Noto Serif</family><default><family>serif</family></default></alias>
  <alias binding="same"><family>Liberation Serif</family><default><family>serif</family></default></alias>

  <alias binding="same"><family>Monospace</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>ui-monospace</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Courier</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Courier New</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Consolas</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Menlo</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Monaco</family><default><family>monospace</family></default></alias>
  <alias binding="same"><family>Liberation Mono</family><default><family>monospace</family></default></alias>

  <!-- Last-resort: append a concrete font so a truly-unknown family that
       matched none of the above still gets a real font instead of nothing. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
