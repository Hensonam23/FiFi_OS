<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  FiFi OS font compatibility aliases.

  Microsoft (Windows) and Apple (macOS) system fonts are proprietary and cannot
  be legally redistributed, so FiFi OS ships free, metric-compatible substitutes
  and maps the proprietary names onto them. Any application (browser, GTK app,
  document viewer) that asks for "Arial", "Calibri", "Segoe UI", "Helvetica",
  "San Francisco", etc. gets a font of matching metrics and appearance — so a
  user's "preferred font" just works, whatever platform they came from.

  Substitutes bundled by FiFi OS:
    Liberation Sans/Serif/Mono  -> Arial / Times New Roman / Courier New
    Carlito                     -> Calibri
    Caladea                     -> Cambria
    Noto Sans/Serif/Mono        -> broad Latin + humanist UI faces
    Noto Sans/Serif CJK         -> Chinese / Japanese / Korean
    Noto Color Emoji            -> color emoji
    DejaVu Sans/Serif/Mono      -> classic Linux defaults
-->
<fontconfig>

  <!-- ============================ Windows sans ============================ -->
  <match target="pattern"><test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Arial Narrow</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans Narrow</string></edit></match>
  <match target="pattern"><test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Microsoft Sans Serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>MS Sans Serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="same"><string>Carlito</string></edit></match>
  <match target="pattern"><test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Verdana</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Trebuchet MS</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Comic Sans MS</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Impact</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>

  <!-- ============================ Windows serif =========================== -->
  <match target="pattern"><test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family"><string>Times</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="same"><string>Caladea</string></edit></match>
  <match target="pattern"><test name="family"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif</string></edit></match>
  <match target="pattern"><test name="family"><string>Palatino Linotype</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif</string></edit></match>
  <match target="pattern"><test name="family"><string>Book Antiqua</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif</string></edit></match>

  <!-- ========================== Windows monospace ========================= -->
  <match target="pattern"><test name="family"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>Courier</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>Consolas</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>Lucida Console</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans Mono</string></edit></match>

  <!-- =========================== macOS system ============================= -->
  <!-- CSS system-font stacks: -apple-system / BlinkMacSystemFont / SF families -->
  <match target="pattern"><test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>San Francisco</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>SF Pro</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>SF Pro Text</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>SF Pro Display</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>.SF NS Text</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Lucida Grande</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>SF Mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>Menlo</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>Monaco</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans Mono</string></edit></match>

  <!-- macOS CJK -->
  <match target="pattern"><test name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>PingFang TC</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family"><string>PingFang HK</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK HK</string></edit></match>
  <match target="pattern"><test name="family"><string>Hiragino Sans</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK JP</string></edit></match>
  <match target="pattern"><test name="family"><string>Hiragino Kaku Gothic ProN</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK JP</string></edit></match>
  <match target="pattern"><test name="family"><string>Apple SD Gothic Neo</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK KR</string></edit></match>
  <match target="pattern"><test name="family"><string>Apple Color Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit></match>

  <!-- Windows CJK -->
  <match target="pattern"><test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Microsoft JhengHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family"><string>MS Gothic</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK JP</string></edit></match>
  <match target="pattern"><test name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK KR</string></edit></match>
  <match target="pattern"><test name="family"><string>Segoe UI Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit></match>

  <!-- ===================== Generic family fallbacks ======================= -->
  <!-- Preferred faces for the three CSS generics, then CJK + emoji appended so
       any glyph missing from the Latin face falls through gracefully. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Liberation Serif</family>
      <family>DejaVu Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

</fontconfig>
