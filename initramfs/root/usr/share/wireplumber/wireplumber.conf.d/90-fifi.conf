# FiFi creates the laptop ALSA nodes itself, so WirePlumber supplies only
# routing policy and Bluetooth discovery. The systemwide mixin avoids logind,
# portal, and seat-service dependencies that this compact image does not ship.
wireplumber.profiles = {
  fifi = {
    inherits = [ base, mixin.systemwide-session ]
    metadata.sm-settings = required
    metadata.sm-objects = required
    policy.standard = required
    hardware.bluetooth = required
  }
}
