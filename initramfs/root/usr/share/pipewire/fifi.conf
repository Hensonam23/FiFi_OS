context.properties = {
    core.daemon = true
    core.name   = pipewire-0
    support.dbus = false
    log.level = 2
    link.max-buffers = 16
    default.clock.rate = 48000
    default.clock.quantum = 1024
    default.clock.min-quantum = 32
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    audio.adapt      = audioconvert/libspa-audioconvert
    api.alsa.*       = alsa/libspa-alsa
    support.*        = support/libspa-support
    audio.mixer      = audiomixer/libspa-audiomixer
}
context.modules = [
    { name = libpipewire-module-rt              flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata        flags = [ ifexists nofail ] }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access          flags = [ nofail ] }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = metadata
        args = {
            metadata.name = default
            metadata.values = [
                { key = default.audio.sink value = { name = fifi-output } }
                { key = default.audio.source value = { name = fifi-input } }
            ]
        }
    }
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            node.group      = pipewire.dummy
            priority.driver = 20000
        }
    }

    # FiFi does not run udev or a separate session manager. Create the selected
    # laptop PCM directly so PulseAudio-compatible apps always get a real sink
    # and source instead of connecting to an empty hardware graph. init replaces
    # the token with the first analog duplex PCM found on each machine.
    { factory = adapter
        args = {
            factory.name = api.alsa.pcm.sink
            node.name = fifi-output
            node.description = "FiFi Audio Output"
            media.class = "Audio/Sink"
            api.alsa.path = "@FIFI_ALSA_PATH@"
            audio.channels = 2
            audio.position = [ FL FR ]
            node.suspend-on-idle = true
            adapter.auto-port-config = {
                mode = dsp
                monitor = false
                control = false
                position = preserve
            }
        }
    }
    { factory = adapter
        args = {
            factory.name = api.alsa.pcm.source
            node.name = fifi-input
            node.description = "FiFi Audio Input"
            media.class = "Audio/Source"
            api.alsa.path = "@FIFI_ALSA_PATH@"
            audio.channels = 2
            audio.position = [ FL FR ]
            node.suspend-on-idle = true
            adapter.auto-port-config = {
                mode = dsp
                monitor = false
                control = false
                position = preserve
            }
        }
    }
]
