<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- FiFi OS system bus. Single-user box: run the bus as root (no messagebus
     user to drop to on this minimal system) with a permissive default policy.
     Service policy files (e.g. BlueZ's org.bluez.conf) are pulled in via the
     include dirs. Used by bluetoothd for pairing + PipeWire's bluez5 plugin. -->
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>

  <policy context="default">
    <!-- Accept local connections from the unprivileged desktop account. D-Bus
         otherwise authenticates root only on a system bus, which left
         WirePlumber unable to reach BlueZ even though the socket was local. -->
    <allow user="fifi"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="signal"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
  </policy>

  <includedir>/usr/share/dbus-1/system.d</includedir>
  <includedir>/etc/dbus-1/system.d</includedir>
  <servicedir>/usr/share/dbus-1/system-services</servicedir>
</busconfig>
